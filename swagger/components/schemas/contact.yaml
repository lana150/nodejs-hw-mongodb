type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'Alina V'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: +382345807598
  email:
    description: "Contact's email"
    type: string
    example: alina@mail.com
  isFavourite:
    description: ""
    type: boolean
    example: false
  contactType:
    description: 'Selection of contacts by category'
    type: string
    enum: ['work', 'home', 'personal']
    example: 'personal'
  userId:
    description: 'Contacts users'
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: 'Link to contact photo'
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
