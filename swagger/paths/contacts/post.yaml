#/swagger/paths/students/post.yaml

tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email 
        properties:
          name:
            description: "Contact`s name"
            type: string
            example: 'Max Low'
          phoneNumber:
            description: "Contact`s phone number"
            type: string
            example: "+329753693468"
          email:
            description: "Contacts email"
            type: string
            example: "mlow@mail.com"
          isFavourite:
            description: 'Selection of frequently used contacts'
            type: boolean
            example: false
          contactType:
            description: 'Selection of contacts by category'
            type: string
            enum: ['work', 'home', 'personal']
            example: 'personal'
          photo:
            description: "Contact`s photo"
            type: string
            format: binary
responses:
  '201':
    description: Creates contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created contact!
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: '../../components/responses/401.yaml'
  '400':
    $ref: '../../components/responses/400.yaml'
